<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Compas de piso</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:540px;margin:auto;min-height:100dvh;padding:24px 18px 104px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#768198;font-weight:750}.top h1{font-size:29px;margin:5px 0 20px;letter-spacing:-1px}.iconbtn{border:0;background:white;border-radius:15px;padding:11px;font-size:21px;box-shadow:0 3px 15px #14213d0b}.hero{background:linear-gradient(125deg,#24366c,#5967d9);color:white;border-radius:25px;padding:23px;box-shadow:0 12px 28px #4955bd30}.hero small{opacity:.8}.total{font-size:39px;font-weight:850;margin:8px 0 15px;letter-spacing:-1px}.herofoot{display:flex;justify-content:space-between;gap:12px;font-size:13px}.herofoot span{opacity:.8}.section{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}.section h2{font-size:18px;margin:0}.muted{color:#8790a1;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{background:white;padding:15px 11px;border-radius:18px;border:1px solid #edf0f5}.avatar{height:31px;width:31px;border-radius:12px;display:grid;place-items:center;background:#e9eafa;color:#5057b8;font-weight:800;margin-bottom:10px}.mini strong{display:block;font-size:17px;margin:5px 0}.mini .muted{font-size:11px}.list{display:flex;flex-direction:column;gap:9px}.item{background:white;border:1px solid #eef0f4;border-radius:17px;padding:14px;display:flex;align-items:center;gap:12px}.item .emoji{width:42px;height:42px;display:grid;place-items:center;background:#f1f4fc;border-radius:13px;font-size:21px}.item .detail{flex:1;min-width:0}.item strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{color:#929bab;font-size:12px}.amount{font-weight:800;white-space:nowrap}.pill{display:inline-block;border-radius:30px;background:#e9f7ee;color:#278051;padding:5px 9px;font-size:11px;font-weight:700}.empty{padding:30px 15px;text-align:center;background:white;border-radius:17px;color:#8a93a2}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #e9ecf3;padding:9px 7px max(10px,env(safe-area-inset-bottom));box-shadow:0 -5px 20px #19233b0b}.nav button{border:0;background:none;color:#9299a9;padding:7px 2px;font-size:11px;font-weight:700}.nav button b{display:block;font-size:23px;margin-bottom:3px}.nav button.active{color:#5058c7}.fab{position:fixed;bottom:88px;right:max(calc((100vw - 540px)/2 + 20px),20px);border:0;background:#5964d9;color:white;border-radius:17px;padding:14px 18px;box-shadow:0 8px 23px #5964d966;font-weight:750}.hidden{display:none!important}.panel{background:white;border-radius:20px;padding:18px;border:1px solid #edf0f5;margin-top:12px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #e0e5ef;background:#fafbfe;border-radius:12px;padding:13px;color:#202b43;outline-color:#6670e2}.checkrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f2f7}.checkrow input{width:19px;height:19px;accent-color:#5964d9}.primary{border:0;background:#5865d7;color:white;border-radius:13px;padding:13px 16px;font-weight:800}.secondary{border:1px solid #e1e5ed;background:white;color:#34405b;border-radius:12px;padding:10px 12px;font-weight:700}.danger{color:#c94755}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tip{background:#fff8e8;color:#886a2a;padding:13px;border-radius:13px;font-size:12px;line-height:1.5;margin:15px 0}.done{text-decoration:line-through;color:#a2a9b6}.balance{padding:15px;border-radius:16px;background:#f4f5fd;margin:10px 0}.balance strong{display:block;margin-bottom:5px}.balance small{color:#7a8498}.tiny{border:0;background:#f1f3f9;border-radius:10px;padding:8px;color:#52607d}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.link{border:0;background:none;color:#5865d7;font-weight:750}.sub{font-size:12px;color:#8791a2;line-height:1.5}.wide{width:100%}.authwrap{max-width:440px;margin:12vh auto;padding:24px}.authwrap h1{font-size:28px}.authwrap .panel{box-shadow:0 15px 35px #14213d13}.status{font-size:12px;color:#667085;text-align:center;margin:8px 0}.logout{margin-top:8px}</style></head><body><div id="auth" class="authwrap"><div class="eyebrow">🏡 Espacio privado</div><h1>Compas de piso</h1><div class="panel"><h2>Iniciar sesión</h2><p class="sub">Accede con tu nombre y contraseña. Solo pueden entrar los tres compañeros autorizados.</p><form id="loginForm"><div class="field"><label>Usuario</label><select id="loginEmail" autocomplete="username" required><option value="david">David</option><option value="hector">Héctor</option><option value="victor">Víctor</option></select></div><div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="primary wide" type="submit">Entrar</button></form><p id="loginError" class="sub" role="alert"></p></div><p class="status">Sincronización con Firebase · Plan gratuito Spark</p></div><div id="workspace" class="hidden"><div id="firebaseStatus" style="display:none;margin:16px;padding:14px;background:#fff0ee;border:1px solid #eab1a9;border-radius:12px;color:#9d2c26;font-size:14px"></div><main class="app"><header class="top"><div><div class="eyebrow">🏡 Espacio compartido</div><h1>Compas de piso</h1></div><button class="iconbtn" onclick="show('settings')" aria-label="Ajustes">⚙️</button></header><div id="home"></div><div id="purchases" class="hidden"></div><div id="shopping" class="hidden"></div><div id="balances" class="hidden"></div><div id="settings" class="hidden"></div><div id="editor" class="hidden"></div></main><button id="fab" class="fab" onclick="openPurchase()">＋ Añadir compra</button><nav class="nav" id="nav"><button data-page="home" onclick="show('home')"><b>⌂</b>Inicio</button><button data-page="purchases" onclick="show('purchases')"><b>▤</b>Compras</button><button data-page="shopping" onclick="show('shopping')"><b>☑</b>Pendientes</button><button data-page="balances" onclick="show('balances')"><b>⇄</b>Balances</button></nav></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,setDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDioEh6pH6WYw1Ty9zncmGNin_FdQawcec",authDomain:"compas-de-piso.firebaseapp.com",projectId:"compas-de-piso",storageBucket:"compas-de-piso.firebasestorage.app",messagingSenderId:"399922687827",appId:"1:399922687827:web:789bad75cebe476854bba6"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let state={people:['David','Héctor','Víctor'],purchases:[],shopping:[]},page='home',editing=null,unsubs=[],ready={p:false,s:false,n:false};
const euro=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();const total=()=>state.purchases.reduce((s,p)=>s+p.cents,0);const money=c=>euro(c/100);
function shares(p){let selected=p.between.filter(i=>i>=0&&i<3);if(!selected.length)return [];let base=Math.floor(p.cents/selected.length),rest=p.cents%selected.length;return selected.map((i,k)=>[i,base+(k<rest?1:0)])}
function ledger(){let a=[0,0,0];for(let p of state.purchases){a[p.payer]+=p.cents;for(let [i,c] of shares(p))a[i]-=c}return a}
function settle(){let a=ledger(),debtors=[],creditors=[],out=[];a.forEach((v,i)=>{if(v<0)debtors.push({i,c:-v});if(v>0)creditors.push({i,c:v})});for(let d of debtors)for(let c of creditors){let v=Math.min(d.c,c.c);if(v>0){out.push([d.i,c.i,v]);d.c-=v;c.c-=v}}return out}
const errorMsg=e=>{console.error(e);let msg='Error de Firebase: '+(e.code||'desconocido')+'. Comprueba las reglas de Firestore y la conexión.';let box=document.getElementById('firebaseStatus');if(box){box.textContent=msg;box.style.display='block'}else alert(msg);};
function show(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){try{for(let p of ['home','purchases','shopping','balances','settings','editor'])document.getElementById(p).classList.toggle('hidden',page!==p);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('fab').classList.toggle('hidden',!['home','purchases'].includes(page));if(page==='home')renderHome();if(page==='purchases')renderPurchases();if(page==='shopping')renderShopping();if(page==='balances')renderBalances();if(page==='settings')renderSettings()}catch(e){console.error(e);const target=document.getElementById(page);if(target)target.innerHTML='<div class="tip">No se ha podido mostrar esta sección. Comprueba los datos de las compras.</div>';errorMsg(e)}}
function sync(){let box=document.getElementById('firebaseStatus');if(box&&Object.values(ready).every(Boolean))box.style.display='none';render()}
function listen(){unsubs.forEach(f=>f());unsubs=[];ready={p:false,s:false,n:false};render();
 unsubs.push(onSnapshot(collection(db,'purchases'),snap=>{state.purchases=snap.docs.map(d=>d.data()).filter(p=>p&&Array.isArray(p.between)&&Number.isInteger(p.cents));ready.p=true;sync()},errorMsg));
 unsubs.push(onSnapshot(collection(db,'shopping'),snap=>{state.shopping=snap.docs.map(d=>d.data());ready.s=true;sync()},errorMsg));
 unsubs.push(onSnapshot(doc(db,'settings','house'),snap=>{if(snap.exists()&&Array.isArray(snap.data().people)&&snap.data().people.length===3)state.people=snap.data().people;ready.n=true;sync()},errorMsg));
}
const put=(coll,id,data)=>setDoc(doc(db,coll,id),data).catch(errorMsg);
const remove=(coll,id)=>deleteDoc(doc(db,coll,id)).catch(errorMsg);
const save=()=>render();
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;document.getElementById('loginError').textContent='';try{await signInWithEmailAndPassword(auth,document.getElementById('loginEmail').value.trim()+'@compas-de-piso.local',document.getElementById('loginPassword').value)}catch(err){document.getElementById('loginError').textContent='No se pudo entrar. Revisa el usuario y la contraseña.'}finally{btn.disabled=false}});
onAuthStateChanged(auth,user=>{document.getElementById('auth').classList.toggle('hidden',!!user);document.getElementById('workspace').classList.toggle('hidden',!user);if(user){listen()}else{unsubs.forEach(f=>f());unsubs=[];state={people:['David','Héctor','Víctor'],purchases:[],shopping:[]}}});
window.logout=()=>signOut(auth).catch(errorMsg);
function purchaseItem(p){const payer=state.people[Number(p.payer)]||'Compañero';const participants=(p.between||[]).map(i=>state.people[Number(i)]).filter(Boolean).join(', ');return `<div class="item"><span class="emoji">🛍️</span><div class="detail"><strong>${esc(p.name||'Compra')}</strong><small>${esc(payer)} · ${esc(p.date||'Sin fecha')}<br>Repartido: ${esc(participants)}</small></div><div style="text-align:right"><div class="amount">${money(p.cents||0)}</div><button class="link" onclick="openPurchase('${esc(p.id)}')">Editar</button></div></div>`}
function renderHome(){let ledgerArr=ledger();document.getElementById('home').innerHTML=`<div class="hero"><small>Gastos acumulados</small><div class="total">${money(total())}</div><div class="herofoot"><div><span>Compras registradas</span><br><b>${state.purchases.length}</b></div><div><span>Pendientes de comprar</span><br><b>${state.shopping.filter(x=>!x.done).length}</b></div></div></div><div class="section"><h2>Compañeros</h2><span class="muted">Balance neto</span></div><div class="cards">${state.people.map((n,i)=>`<div class="mini"><div class="avatar">${esc(n.charAt(0).toUpperCase())}</div><div class="muted">${esc(n)}</div><strong>${money(ledgerArr[i])}</strong><div class="muted">${ledgerArr[i]>=0?'A favor':'Debe'}</div></div>`).join('')}</div><div class="section"><h2>Últimas compras</h2><button class="link" onclick="show('purchases')">Ver todas</button></div><div class="list">${state.purchases.length?state.purchases.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,4).map(purchaseItem).join(''):'<div class="empty">🛍️<br>Todavía no hay compras. ¡Añade la primera!</div>'}</div><div class="section"><h2>Por comprar</h2><button class="link" onclick="show('shopping')">Ver lista</button></div><div class="list">${state.shopping.filter(x=>!x.done).slice(0,3).map(x=>`<div class="item"><span>🛒</span><div class="detail"><strong>${esc(x.name)}</strong></div></div>`).join('')||'<div class="empty">No hay productos pendientes.</div>'}</div>`}
function renderPurchases(){document.getElementById('purchases').innerHTML=`<div class="section"><h2>Historial de compras</h2><span class="pill">${state.purchases.length} compras</span></div><div class="list">${state.purchases.length?state.purchases.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(purchaseItem).join(''):'<div class="empty">No hay compras registradas.</div>'}</div>`}
function renderShopping(){document.getElementById('shopping').innerHTML=`<div class="section"><h2>Lista de la compra</h2><span class="pill">${state.shopping.filter(x=>!x.done).length} pendientes</span></div><form class="panel" onsubmit="addShopping(event)"><div class="field"><label for="need">¿Qué falta en casa?</label><input id="need" maxlength="100" required placeholder="Ej. Papel higiénico"></div><button class="primary wide">＋ Añadir a la lista</button></form><div class="section"><h2>Productos</h2></div><div class="list">${state.shopping.length?state.shopping.slice().sort((a,b)=>Number(a.done)-Number(b.done)).map(x=>`<div class="item"><input type="checkbox" style="width:20px;height:20px;accent-color:#5964d9" ${x.done?'checked':''} onchange="toggleShopping('${x.id}')" aria-label="Marcar comprado"><div class="detail"><strong class="${x.done?'done':''}">${esc(x.name)}</strong><small>${x.done?'Comprado':'Pendiente'}</small></div><button class="tiny danger" onclick="removeShopping('${x.id}')" aria-label="Eliminar">✕</button></div>`).join(''):'<div class="empty">La lista está vacía.</div>'}</div>`}
function addShopping(e){e.preventDefault();let name=document.getElementById('need').value.trim();if(!name)return;let x={id:uid(),name,done:false};put('shopping',x.id,x)}function toggleShopping(id){let x=state.shopping.find(x=>x.id===id);if(x){put('shopping',x.id,{...x,done:!x.done})}}function removeShopping(id){remove('shopping',id)}
function renderBalances(){let a=ledger(),trans=settle();document.getElementById('balances').innerHTML=`<div class="section"><h2>Balance entre compañeros</h2></div><div class="panel"><p class="sub">Cada compra se divide únicamente entre los participantes seleccionados, aunque la haya pagado otra persona.</p>${state.people.map((n,i)=>`<div class="checkrow"><div><strong>${esc(n)}</strong><div class="sub">${a[i]>0?'Tiene dinero a favor':a[i]<0?'Tiene dinero pendiente de pagar':'Está al día'}</div></div><strong style="color:${a[i]<0?'#ce5961':'#32946c'}">${money(a[i])}</strong></div>`).join('')}</div><div class="section"><h2>Cómo saldar las cuentas</h2></div>${trans.length?trans.map(([d,c,v])=>`<div class="balance"><strong>${esc(state.people[d])} → ${esc(state.people[c])}</strong><div>${money(v)}</div><small>Transferencia sugerida</small></div>`).join(''):'<div class="empty">🎉 ¡Todo está equilibrado!</div>'}<p class="sub">Los balances muestran lo que corresponde pagar según el historial. No registran transferencias ya realizadas.</p>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="section"><h2>Ajustes del piso</h2></div><form class="panel" onsubmit="rename(event)"><p class="sub">Puedes cambiar los nombres sin alterar las compras existentes.</p>${state.people.map((n,i)=>`<div class="field"><label>Compañero ${i+1}</label><input name="person${i}" value="${esc(n)}" maxlength="35" required></div>`).join('')}<button class="primary wide">Guardar nombres</button></form><div class="section"><h2>Datos y privacidad</h2></div><div class="panel"><div class="tip">🔒 Los datos se sincronizan entre los compañeros autorizados mediante Firebase. Exporta copias de seguridad periódicas. No compartas contraseñas.</div><div class="actions"><button class="secondary" onclick="exportData()">↓ Exportar copia</button><label class="secondary" style="cursor:pointer">↑ Importar copia<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div><p class="sub">La copia JSON sirve como respaldo. La importación automática está desactivada.</p><button class="secondary logout" onclick="logout()">Cerrar sesión</button></div>`}function rename(e){e.preventDefault();let f=new FormData(e.target);let people=[0,1,2].map(i=>String(f.get('person'+i)).trim());put('settings','house',{people})}
function openPurchase(id){editing=id||null;let p=state.purchases.find(x=>x.id===id)||{name:'',cents:0,payer:0,between:[0,1,2],date:new Date().toLocaleDateString('en-CA')};page='editor';render();document.getElementById('editor').innerHTML=`<div class="section"><h2>${editing?'Editar compra':'Nueva compra'}</h2><button class="link" onclick="show('purchases')">Cerrar ✕</button></div><form class="panel" onsubmit="savePurchase(event)"><div class="field"><label>Producto o concepto</label><input name="name" value="${esc(p.name)}" required maxlength="100" placeholder="Ej. Detergente"></div><div class="field"><label>Precio (€)</label><input name="price" inputmode="decimal" value="${p.cents?(p.cents/100).toFixed(2).replace('.',','):''}" required placeholder="12,50"></div><div class="field"><label>¿Quién lo ha pagado?</label><select name="payer">${state.people.map((n,i)=>`<option value="${i}" ${p.payer===i?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${p.date}" required></div><div class="field"><label>¿Entre quiénes se reparte?</label>${state.people.map((n,i)=>`<label class="checkrow" style="font-weight:500"><span>${esc(n)}</span><input type="checkbox" name="between" value="${i}" ${p.between.includes(i)?'checked':''}></label>`).join('')}</div><div class="actions"><button class="primary" style="flex:1">${editing?'Guardar cambios':'Guardar compra'}</button>${editing?`<button type="button" class="secondary danger" onclick="deletePurchase()">Eliminar</button>`:''}</div></form>`;scrollTo(0,0)}function savePurchase(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim(),raw=String(f.get('price')).trim().replace(',','.'),cents=Math.round(Number(raw)*100),between=f.getAll('between').map(Number),payer=Number(f.get('payer')),date=String(f.get('date'));if(!name||!Number.isFinite(cents)||cents<=0||!between.length||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Revisa el precio, la fecha y selecciona al menos un participante.');return}let p={id:editing||uid(),name,cents,payer,between,date};put('purchases',p.id,p);show('purchases')}function deletePurchase(){if(!confirm('¿Eliminar esta compra?'))return;remove('purchases',editing);show('purchases')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='compas-de-piso-copia.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){alert('La importación de copias está desactivada en la versión compartida para evitar sobrescribir compras de otros compañeros.')} 
Object.assign(window,{show,openPurchase,savePurchase,deletePurchase,addShopping,toggleShopping,removeShopping,rename,exportData,importData});
</script></body></html>
